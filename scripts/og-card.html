<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #e9e9e5;
      color: #30343a;
    }
    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 52px 64px 44px;
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(48, 52, 58, 0.12);
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      letter-spacing: 0.16em;
      color: rgba(48, 52, 58, 0.52);
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 40px;
      align-items: center;
      padding-top: 12px;
    }
    h1 {
      margin: 0;
      font-size: 92px;
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.92;
    }
    h1 em {
      color: #c65f38;
      font-style: normal;
    }
    .count {
      text-align: right;
      padding-bottom: 8px;
    }
    .count strong {
      display: block;
      font-size: 148px;
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 0.78;
      color: rgba(48, 52, 58, 0.16);
    }
    .count span {
      display: block;
      margin-top: 10px;
      color: #c65f38;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      letter-spacing: 0.18em;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      padding-top: 22px;
      border-top: 1px solid rgba(48, 52, 58, 0.12);
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      letter-spacing: 0.04em;
      color: rgba(48, 52, 58, 0.58);
    }
    .flow {
      color: #c65f38;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="meta">
    <span>SPX 0DTE</span>
    <span>EXPERIMENTAL SETUPS · V1.1</span>
    <span>ET SESSION</span>
  </div>
  <div class="grid">
    <h1>Read <em>5m</em>.<br />Execute <em>1m</em>.</h1>
    <div class="count">
      <strong>06</strong>
      <span>SETUPS</span>
    </div>
  </div>
  <div class="foot">
    <span>01 Sweep · 02 Hold · 03 VWAP · 04 Wall · 05 Compress · 06 Turn</span>
    <span class="flow">Observation → Confirmation → Risk</span>
  </div>
</body>
</html>
